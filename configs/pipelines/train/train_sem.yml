exp_name: "'@{dataset.name}'_'@{network.name}'_'@{trainer.name}'\
_e'@{optimizer.num_epochs}'_lr'@{optimizer.lr}'"
output_dir: ./results/
save_output: True
merge_option: default

num_gpus: 1
num_workers: 0
num_machines: 1
machine_rank: 0

pipeline:
  name: finetune

network:
  pretrained: True

trainer:
  name: sae
  trainer_args:
    num_clusters: 10
    feature_type: flat  # flat/mean/stat
    reduce_dim: pca_10  # none/capca_10/pca_50
    loss_weight: [0.1, 0.1, 0.01, 0, 0] # [cls_std, cls_mix, sae_id, sae_ood]
    alpha: 0.5

evaluator:
  name: base

optimizer:
  name: sgd
  num_epochs: 15
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005

recorder:
  name: base
  save_all_models: True
